<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Search People</h1>

        <input
            type="text"
            id="search"
            placeholder="Search person..."
        >

        <div class="cards">

            <div class="card">
                <div class="info">
                    <h2>John Doe</h2>
                    <p>Frontend Developer who loves JavaScript and UI design.</p>
                </div>
            </div>

            <div class="card">
                <div class="info">
                    <h2>Sarah Smith</h2>
                    <p>UI/UX Designer passionate about creating user experiences.</p>
                </div>
            </div>

            <div class="card">
                <div class="info">
                    <h2>Alex Brown</h2>
                    <p>Backend Developer experienced in Node.js and databases.</p>
                </div>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
